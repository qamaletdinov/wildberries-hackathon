[project]
name = "wildberries-hackathon"
version = "0.1.0"
description = "Hackathon: shipment volume forecasting with LightGBM ensemble (DRFAM)"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.6.0",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.0",
    "numpy>=2.0.0",
    "scipy>=1.17.0",
    "pyarrow>=23.0.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
]
