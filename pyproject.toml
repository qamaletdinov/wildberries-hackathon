[project]
name = "wildberries-hackathon"
version = "0.1.0"
description = "Hackathon: shipment volume forecasting with LightGBM ensemble (DRFAM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.6.0",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.0",
    "numpy>=2.0.0",
    "scipy>=1.17.0",
    "pyarrow>=23.0.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
ensemble = [
    "catboost>=1.2.10,<1.3",
    "torch>=2.12.0,<2.13",
    "xgboost>=3.4.0,<3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["eda.py", "solution.py"]
